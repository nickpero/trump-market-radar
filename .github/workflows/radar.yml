name: TRUMP MARKET RADAR

on:
  workflow_dispatch:
    inputs:
      test_fixture:
        description: "Invia un alert Telegram di test"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRUMP_SOURCE_URL: https://trumpstruth.org/feed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_fixture }}" = "true" ]; then
            python main.py --fixture --send-fixture
          else
            python main.py
          fi
      - name: Save deduplication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update radar state"
          git push
